name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appstore-publish
  cancel-in-progress: false

jobs:
  matrix:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      php-min: ${{ steps.versions.outputs.php-min }}
      branches-min: ${{ steps.versions.outputs.branches-min }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get Info
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Tag $tag is not on master"
            exit 1
          fi
          if [ "v$(grep -oPm1 '(?<=<version>)[^<]+' appinfo/info.xml)" != "$tag" ]; then
            echo "::error::appinfo version does not match tag $tag"
            exit 1
          fi
          if ! prerelease=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease); then
            echo "::error::Release $tag does not exist"
            exit 1
          fi
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@8a7bac6300b2f0f3100088b297995a229558ddba # v1.3.2

  publish:
    runs-on: ubuntu-latest
    needs: matrix
    environment: appstore
    permissions:
      contents: write
    steps:
      - name: Set up Nextcloud env
        uses: nextcloud/setup-server-action@34b73d5b0e3633f83a52227d00cc2a6c41d01d9a # v0.5.0
        with:
          nextcloud-version: ${{ needs.matrix.outputs.branches-min }}
          php-version: ${{ needs.matrix.outputs.php-min }}
          node-version: false

      - name: Checkout onlyoffice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ needs.matrix.outputs.tag }}
          path: onlyoffice-src

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build Artifact
        working-directory: onlyoffice-src
        run: |
          npm ci
          npm run build
          composer install --no-dev --optimize-autoloader
          composer scope-dependencies
          rm -rf vendor/firebase
          composer dump-autoload --no-dev --optimize
          mkdir -p onlyoffice
          rsync -av --exclude='onlyoffice' . onlyoffice
          cd onlyoffice
          rm -rf ./.github/
          rm -rf ./.git/
          rm -rf ./assets/document-templates/.git
          rm -rf ./assets/document-formats/.git
          rm -rf ./node_modules/
          rm -rf ./src/
          rm -rf ./tests/
          rm -rf ./vendor-bin/
          rm ./.gitignore
          rm ./.gitmodules
          rm ./.stylelintrc.json
          rm ./CLAUDE.md
          rm ./composer.json
          rm ./composer.lock
          rm ./eslint.config.mjs
          rm ./npm-shrinkwrap.json
          rm ./package.json
          rm ./ruleset.xml
          rm ./stylelint.config.js
          rm ./vite.config.mjs
          rm ./phpunit.xml
          rm ./playwright.config.ts
          rm ./psalm.xml
          rm ./scoper.inc.php
          rm ./tsconfig.json

      - name: Sign Artifact
        working-directory: onlyoffice-src
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_CERTIFICATE: ${{ secrets.APP_CERTIFICATE }}
        run: |
          printf '%s\n' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/onlyoffice.key"
          printf '%s\n' "$APP_CERTIFICATE" > "$RUNNER_TEMP/onlyoffice.crt"
          php "$GITHUB_WORKSPACE/nextcloud/occ" integrity:sign-app \
            --privateKey="$RUNNER_TEMP/onlyoffice.key" \
            --certificate="$RUNNER_TEMP/onlyoffice.crt" \
            --path="$PWD/onlyoffice"
          rm "$RUNNER_TEMP/onlyoffice.key"
          tar -czf onlyoffice.tar.gz onlyoffice

      - name: Attach Artifact to Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        id: attach_to_release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: onlyoffice-src/onlyoffice.tar.gz
          asset_name: onlyoffice-${{ needs.matrix.outputs.tag }}.tar.gz
          tag: ${{ needs.matrix.outputs.tag }}
          overwrite: true

      - name: Upload to Nextcloud App Store
        if: false
        uses: nextcloud-releases/nextcloud-appstore-push-action@a011fe619bcf6e77ddebc96f9908e1af4071b9c1 # v1.0.3
        with:
          app_name: onlyoffice
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: ${{ steps.attach_to_release.outputs.browser_download_url }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          nightly: ${{ needs.matrix.outputs.prerelease }}
